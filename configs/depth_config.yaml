# ============================================================
# Depth Estimation — Student backbone (frozen) + DPT head
# Dataset: NYU-Depth V2
# ============================================================

task: "depth"

# ----------------------------------------------------------
# Dataset
# ----------------------------------------------------------
nyu_depth_root: "/scratch/ag11023/HPML/nyu_depth_v2"
img_size:    224
batch_size:  16
num_workers: 8
pin_memory:  true

# ----------------------------------------------------------
# Student (distilled, frozen backbone)
# ----------------------------------------------------------
student_checkpoint: "checkpoints/sweep_5426108_task3/best.pth"
# true  → frozen backbone, only DPT head trains  (recommended first run)
# false → full fine-tuning: student backbone + DPT head both train
freeze_student: true

# ----------------------------------------------------------
# DPT head
# ----------------------------------------------------------
dpt_pretrained: true   # load head weights from Intel/dpt-swinv2-tiny-256

# ----------------------------------------------------------
# Optimiser & scheduler  (only DPT head trains)
# ----------------------------------------------------------
lr:            4.0e-5   # 1e-4 explodes pretrained DPT; stable at 4-6e-5
lr_min:        1.0e-6
weight_decay:  1.0e-2
grad_clip:     0.5      # tighter clip for pretrained neck stability
warmup_epochs: 8        # longer warmup, peak LR is lower so ramp is gentler
epochs:        10000

# ----------------------------------------------------------
# Mixed precision & checkpointing
# ----------------------------------------------------------
amp:       true
compile:   false    # DPT head has dynamic shapes; skip compile
log_every: 20
save_dir:  "checkpoints/depth"
resume:    null

# ----------------------------------------------------------
# Weights & Biases
# ----------------------------------------------------------
wandb:
  enabled:  true
  project:  "efficient-distillation"
  entity:   "ag11023-new-york-university"
  run_name: null
  tags:     ["swin", "depth-estimation", "nyu-depth-v2", "dpt"]
  mode:     "online"
